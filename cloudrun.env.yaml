# Non-secret settings for Cloud Run (same as [vars] in wrangler.toml).
# Deploy with:  gcloud run deploy … --env-vars-file cloudrun.env.yaml
# Secrets (APIFY_TOKEN, ACCESS_TOKEN, SENDGRID_API_KEY, DATABASE_URL) come from Secret Manager — never put them here.
ENABLED_SOURCES: "apify,propertydata"
DEFAULT_RADIUS_MILES: "3"
MIN_LEASE_MONTHS: "6"
APIFY_RIGHTMOVE_ACTOR: "scrapesage~rightmove-scraper"
APIFY_ZOOPLA_ACTOR: "scrapesage~zoopla-scraper"
APIFY_OTM_ACTOR: "fatihtahta~onthemarket-scraper"
APIFY_OPENRENT_ACTOR: "vivid-softwares~openrent-property-scraper"
APIFY_PORTALS: "rightmove,zoopla,onthemarket,openrent"
APIFY_MAX_RESULTS: "30"
APIFY_RM_DETAILS: "false"
APIFY_OPENRENT_MAX: "10"
MAX_SEARCHES_PER_DAY: "100"
MAX_BATCH_ROWS: "50"
BATCH_CONCURRENCY: "1"
ALERT_FROM_EMAIL: "noreply@thesqua.re"
ALERT_EMAIL_DOMAINS: "thesqua.re"
MAX_ACTIVE_ALERTS: "20"
MAX_ALERTS_PER_EMAIL: "3"
# Set to the Cloud Run URL after the first deploy (used in share links and alert emails), then redeploy:
PUBLIC_URL: "https://jit-inventory-sourcer-REPLACE.europe-west2.run.app"
